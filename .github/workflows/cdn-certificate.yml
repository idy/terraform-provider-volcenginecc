name: CDN certificate updates

on:
  pull_request:
    paths:
      - 'internal/volcengine/cdn/**'
      - 'internal/generic/**'
      - 'internal/provider/**'
      - 'internal/customresources/**'
      - 'scripts/test-cdn-certificate-plan.py'
      - 'GNUmakefile'
      - 'go.mod'
      - 'go.sum'
      - 'version/VERSION'
      - '.github/workflows/cdn-certificate.yml'
  push:
    branches: [main]
    paths:
      - 'internal/volcengine/cdn/**'
      - 'internal/generic/**'
      - 'internal/provider/**'
      - 'internal/customresources/**'
      - 'scripts/test-cdn-certificate-plan.py'
      - 'GNUmakefile'
      - 'go.mod'
      - 'go.sum'
      - 'version/VERSION'
      - '.github/workflows/cdn-certificate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l internal/volcengine/cdn/domain_https*.go)"
      - name: Test certificate lifecycle and races
        run: make test-cdn-certificate
      - name: Verify native Terraform plans without Apply
        run: make test-cdn-certificate-plan
